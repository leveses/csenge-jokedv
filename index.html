<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Öltöztesd fel!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👕</text></svg>">
<style>
  :root{
    --bg1:#ffe3ec; --bg2:#e3f0ff; --ink:#3a2b3f; --accent:#ff5c8a; --panel:#ffffffee;
    --chip:#f4eef7; --chip-on:#ff5c8a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:linear-gradient(170deg,var(--bg1),var(--bg2));
    display:flex;flex-direction:column;height:100dvh;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
    padding-top:env(safe-area-inset-top);
  }
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
  h1{font-size:1.35rem;margin:0;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .btns{display:flex;gap:6px}
  .btns button{
    border:0;border-radius:14px;padding:8px 10px;font-size:1.05rem;background:#fff;
    box-shadow:0 2px 6px #0001;cursor:pointer;
  }
  .btns button:active{transform:scale(.92)}

  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  #stage::after{ /* floor shadow */
    content:"";position:absolute;bottom:4%;left:50%;width:46%;height:5%;transform:translateX(-50%);
    background:radial-gradient(#0002,transparent 70%);border-radius:50%;z-index:0;
  }
  #hero{height:100%;max-width:100%;position:relative;z-index:1;cursor:pointer;overflow:visible}
  #hero .bob{transform-origin:150px 470px;animation:idle 3s ease-in-out infinite}
  #hero.tap .bob{animation:boing .35s ease}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes boing{0%{transform:scale(1,1)}35%{transform:scale(1.07,.92)}70%{transform:scale(.96,1.05)}100%{transform:scale(1,1)}}
  .pop{animation:pop .3s ease}
  @keyframes pop{0%{opacity:.2;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}

  #panel{
    background:var(--panel);border-radius:24px 24px 0 0;box-shadow:0 -4px 20px #0001;
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  }
  #tabs,#items{display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
  #tabs::-webkit-scrollbar,#items::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;border:0;border-radius:999px;padding:8px 14px;font-size:.95rem;font-weight:700;
    background:var(--chip);color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .tab.on{background:var(--chip-on);color:#fff}
  #items{margin-top:10px;padding-bottom:2px}
  .item{
    flex:0 0 auto;width:86px;border:3px solid transparent;border-radius:18px;background:#fff;
    box-shadow:0 2px 8px #0000000f;padding:4px 4px 6px;cursor:pointer;font-family:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .item.on{border-color:var(--accent)}
  .item:active{transform:scale(.94)}
  .item svg{width:72px;height:66px}
  .item span{font-size:.72rem;line-height:1.1;text-align:center;min-height:2.2em;display:flex;align-items:center}
  .none{font-size:2rem;width:72px;height:66px;display:flex;align-items:center;justify-content:center;opacity:.5}

  /* Easter egg */
  #love{
    position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(circle,#ff8fb1ee,#ff4f7ff2);color:#fff;text-align:center;overflow:hidden;
  }
  #love.show{display:flex;animation:fadein .4s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #love .big{font-size:clamp(3rem,16vw,6rem);font-weight:900;text-shadow:0 4px 0 #c22a5a,0 8px 24px #0003;animation:beat 1s ease-in-out infinite}
  #love .heart{font-size:clamp(5rem,30vw,10rem);animation:beat 1s ease-in-out infinite;line-height:1}
  #love small{margin-top:28px;opacity:.85;font-size:.95rem}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
  .fh{position:absolute;bottom:-60px;animation:float linear forwards;pointer-events:none}
  @keyframes float{to{transform:translateY(-120vh) rotate(25deg);opacity:0}}

  #toast{
    position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#3a2b3f;color:#fff;
    padding:8px 14px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40
  }
  #toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>Öltöztesd <span>fel!</span></h1>
  <div class="btns">
    <button id="btnRandom" title="Véletlen szett" aria-label="Véletlen szett">🎲</button>
    <button id="btnReset" title="Eredeti szett" aria-label="Eredeti szett">↺</button>
    <button id="btnSave" title="Kép mentése" aria-label="Kép mentése">📸</button>
  </div>
</header>

<div id="stage">
  <svg id="hero" viewBox="0 -12 300 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Karakter">
    <defs>
      <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse">
        <rect width="14" height="14" fill="#fff"/><rect width="14" height="7" fill="#24407a"/>
      </pattern>
      <pattern id="hawaii" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#1fa99a"/>
        <g fill="#ffd34d"><circle cx="10" cy="10" r="4"/><circle cx="16" cy="10" r="4"/><circle cx="13" cy="5" r="4"/><circle cx="13" cy="15" r="4"/></g>
        <circle cx="13" cy="10" r="2.5" fill="#ff7a59"/>
        <g fill="#ff6fa0"><circle cx="30" cy="28" r="4"/><circle cx="36" cy="28" r="4"/><circle cx="33" cy="23" r="4"/><circle cx="33" cy="33" r="4"/></g>
        <circle cx="33" cy="28" r="2.5" fill="#fff4b0"/>
        <path d="M2 30 q6 -8 12 0 q-6 4 -12 0z M24 6 q6 -8 12 0 q-6 4 -12 0z" fill="#0f7a6d"/>
      </pattern>
      <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="16" height="16" fill="#8f6bff"/><circle cx="8" cy="8" r="3" fill="#ffe14d"/>
      </pattern>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#e0a800"/>
      </linearGradient>
      <radialGradient id="skinG" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#ffd9bd"/><stop offset=".7" stop-color="#f6bd98"/><stop offset="1" stop-color="#e59f7c"/></radialGradient>
      <radialGradient id="faceShade" cx=".5" cy=".38" r=".62"><stop offset=".72" stop-color="#b8603e" stop-opacity="0"/><stop offset="1" stop-color="#b8603e" stop-opacity=".28"/></radialGradient>
      <radialGradient id="blush" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff6f6f" stop-opacity=".55"/><stop offset="1" stop-color="#ff6f6f" stop-opacity="0"/></radialGradient>
      <radialGradient id="noseG" cx=".45" cy=".35" r=".7"><stop offset="0" stop-color="#ffcfae"/><stop offset="1" stop-color="#e8a07d"/></radialGradient>
      <radialGradient id="iris" cx=".45" cy=".35" r=".65"><stop offset="0" stop-color="#b98a52"/><stop offset=".6" stop-color="#7a4f28"/><stop offset="1" stop-color="#3d2410"/></radialGradient>
      <radialGradient id="eyeW" cx=".5" cy=".6" r=".6"><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#e9dcd6"/></radialGradient>
      <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e3d28"/><stop offset="1" stop-color="#2c1b11"/></linearGradient>
      <linearGradient id="clothShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <g class="bob"><g id="layers"></g></g>
  </svg>
</div>

<div id="panel">
  <div id="tabs"></div>
  <div id="items"></div>
</div>

<div id="love" aria-live="polite">
  <div class="heart">❤️</div>
  <div class="big">Szeretlek!</div>
  <small>(koppints a bezáráshoz)</small>
</div>
<div id="toast"></div>

<script>
/* ---------- Színek ---------- */
const SKIN = "#f7c4a2", SKIN_D = "#e2a582", HAIR = "#3a281d", HAIR_L = "#5a4130";
const OUT = 'stroke="#4a2c26" stroke-opacity=".4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';

/* Kar útvonalak (váll -> csukló) */
const ARM_L = "M104 250 Q86 292 82 334";
const ARM_R = "M196 250 Q214 292 218 334";

const ARM_R_SHORT = "M196 250 Q206 272 210 292";
const TORSO = "M94 238 Q150 214 206 238 Q218 300 210 354 L90 354 Q82 300 94 238 Z";

const sleeves = (col, short, w=34) => {

  return `<path d="${L}" stroke="#4a2c26" stroke-opacity=".3" stroke-width="${w+4}" stroke-linecap="round" fill="none"/>
          <path d="${R}" stroke="#4a2c26" stroke-opacity=".3" stroke-width="${w+4}" stroke-linecap="round" fill="none"/>
          <path d="${L}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"/>
          <path d="${R}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
};

/* ---------- Alap test ---------- */
function bodyBase(){
  return `
  <!-- lábak -->
  <rect x="110" y="340" width="36" height="112" rx="16" fill="${SKIN}" ${OUT}/>
  <rect x="154" y="340" width="36" height="112" rx="16" fill="${SKIN}" ${OUT}/>
  <ellipse cx="124" cy="456" rx="20" ry="9" fill="${SKIN}" ${OUT}/>
  <ellipse cx="176" cy="456" rx="20" ry="9" fill="${SKIN}" ${OUT}/>
  <!-- alsó -->
  <path d="M100 330 L200 330 L202 382 L154 382 L150 366 L146 382 L98 382 Z" fill="#5b7fc0" ${OUT}/>
  <g fill="#ff6f91"><path d="M120 352 c-4-6 -12 0 0 8 c12-8 4-14 0-8z"/><path d="M178 358 c-4-6 -12 0 0 8 c12-8 4-14 0-8z"/></g>`;
}
function torsoBase(){
  return `
  <rect x="135" y="192" width="30" height="46" fill="${SKIN}" ${OUT}/>
  <path d="${TORSO}" fill="${SKIN}" ${OUT}/>
  <path d="${ARM_L}" stroke="#c98261" stroke-opacity=".5" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="${ARM_R}" stroke="#c98261" stroke-opacity=".5" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="${ARM_L}" stroke="${SKIN}" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="${ARM_R}" stroke="${SKIN}" stroke-width="26" stroke-linecap="round" fill="none"/>`;
}
function hands(){
  return `<circle cx="81" cy="342" r="15" fill="${SKIN}" ${OUT}/>
          <circle cx="219" cy="342" r="15" fill="${SKIN}" ${OUT}/>`;
}
function head(){
  const eye = cx => `
    <ellipse cx="${cx}" cy="133" rx="17" ry="19" fill="url(#eyeW)"/>
    <circle cx="${cx+1}" cy="135" r="12" fill="url(#iris)"/>
    <circle cx="${cx+1}" cy="135" r="5.8" fill="#1a0f08"/>
    <circle cx="${cx+6}" cy="129" r="4.2" fill="#fff"/>
    <circle cx="${cx-3}" cy="140" r="1.8" fill="#fff" opacity=".9"/>
    <path d="M${cx-18} 131 Q${cx} 108 ${cx+18} 131" stroke="#2a1810" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M${cx-13} 154 Q${cx} 160 ${cx+13} 154" stroke="#d48a6c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/>`;
  return `
  <!-- fülek -->
  <ellipse cx="80" cy="144" rx="14" ry="19" fill="url(#skinG)" stroke="#c98261" stroke-opacity=".5" stroke-width="2"/>
  <ellipse cx="220" cy="144" rx="14" ry="19" fill="url(#skinG)" stroke="#c98261" stroke-opacity=".5" stroke-width="2"/>
  <ellipse cx="81" cy="145" rx="6" ry="10" fill="#e09474" opacity=".55"/>
  <ellipse cx="219" cy="145" rx="6" ry="10" fill="#e09474" opacity=".55"/>
  <!-- nyak árnyék -->
  <ellipse cx="150" cy="226" rx="30" ry="8" fill="#b9714f" opacity=".35"/>
  <!-- pufi, kerek arc -->
  <path d="M78 130 Q76 56 150 52 Q224 56 222 130 Q226 186 200 208 Q178 226 150 226 Q122 226 100 208 Q74 186 78 130 Z" fill="url(#skinG)" stroke="#c98261" stroke-opacity=".55" stroke-width="2"/>
  <path d="M78 130 Q76 56 150 52 Q224 56 222 130 Q226 186 200 208 Q178 226 150 226 Q122 226 100 208 Q74 186 78 130 Z" fill="url(#faceShade)"/>
  <ellipse cx="150" cy="84" rx="44" ry="16" fill="#fff" opacity=".22" filter="url(#soft)"/>
  <!-- enyhe borosta -->
  <path d="M90 170 Q100 218 150 222 Q200 218 210 170 Q200 206 150 210 Q100 206 90 170 Z" fill="#6b4632" opacity=".09"/>
  <!-- pirospozsgás orcák -->
  <ellipse cx="100" cy="170" rx="24" ry="16" fill="url(#blush)"/>
  <ellipse cx="200" cy="170" rx="24" ry="16" fill="url(#blush)"/>
  <!-- vidám, vastag szemöldök -->
  <path d="M98 108 Q114 92 140 100 Q143 107 136 110 Q118 104 104 115 Q96 115 98 108 Z" fill="#3b2618"/>
  <path d="M202 108 Q186 92 160 100 Q157 107 164 110 Q182 104 196 115 Q204 115 202 108 Z" fill="#3b2618"/>

  ${eye(119)}${eye(181)}
  <!-- kerek, puha orr -->
  <path d="M146 140 Q142 150 140 156" stroke="#d48a6c" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/>
  <ellipse cx="150" cy="162" rx="15" ry="12" fill="url(#noseG)"/>
  <ellipse cx="142" cy="168" rx="3.6" ry="2.3" fill="#a85a42" opacity=".55"/>
  <ellipse cx="158" cy="168" rx="3.6" ry="2.3" fill="#a85a42" opacity=".55"/>
  <ellipse cx="154" cy="157" rx="4.5" ry="3.2" fill="#fff" opacity=".55"/>
  <!-- nagy, kedves mosoly -->
  <path d="M112 181 Q150 188 188 181 Q180 208 150 210 Q120 208 112 181 Z" fill="#6e1f24"/>
  <path d="M116 183 Q150 190 184 183 L181 194 Q150 200 119 194 Z" fill="#fff"/>
  <path d="M132 203 Q150 196 168 203 Q160 209 150 209 Q140 209 132 203 Z" fill="#e0606a"/>
  <path d="M112 181 Q150 188 188 181" stroke="#c9705a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M126 210 Q150 220 174 210" stroke="#e8907e" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M106 176 q-5 6 1 11 M194 176 q5 6 -1 11" stroke="#c97a5e" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
}
function hair(){
  return `
  <path d="M84 132 Q80 112 86 98 L96 106 Q90 118 90 134 Z" fill="${HAIR}" opacity=".85"/>
  <path d="M216 132 Q220 112 214 98 L204 106 Q210 118 210 134 Z" fill="${HAIR}" opacity=".85"/>
  <path d="M82 120 Q72 78 98 54 Q120 30 156 30 Q194 30 214 56 Q230 80 218 120
           Q214 102 206 94 Q198 86 186 90 Q176 78 162 86 Q150 76 136 86 Q122 80 112 90 Q98 88 92 100 Q86 108 82 120 Z"
        fill="url(#hairG)" stroke="#20130b" stroke-opacity=".5" stroke-width="1.5"/>
  <path d="M112 50 Q124 20 152 24 Q168 8 190 22 Q210 32 212 58 Q192 40 168 40 Q142 34 112 50 Z" fill="url(#hairG)"/>
  <path d="M106 62 Q136 36 176 40 Q148 48 130 64 Q118 60 106 62 Z" fill="#8a5c3e" opacity=".55"/>
  <path d="M168 48 Q196 46 210 70 Q194 60 176 62 Z" fill="#8a5c3e" opacity=".45"/>
  <path d="M112 86 Q118 68 132 58 M140 82 Q148 64 164 54 M170 80 Q182 64 196 62" stroke="#7a5034" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>`;
}

/* ---------- Ruhák ---------- */
const C = {
  hat:{label:"Sapka", view:"55 -12 190 160", items:[
    {id:"none", name:"Semmi"},
    {id:"cap", name:"Baseball sapka", svg:`
      <path d="M80 112 Q78 40 150 36 Q222 40 220 112 Z" fill="#e8434b" ${OUT}/>
      <path d="M150 36 L150 104" stroke="#b52d35" stroke-width="3"/>
      <circle cx="150" cy="38" r="5" fill="#b52d35"/>
      <path d="M76 108 Q150 92 224 108 Q244 122 228 130 Q150 112 72 130 Q58 122 76 108 Z" fill="#c22f38" ${OUT}/>`},
    {id:"beanie", name:"Kötött sapka", svg:`
      <path d="M78 112 Q74 36 150 32 Q226 36 222 112 Z" fill="#ffb347" ${OUT}/>
      <g stroke="#e89530" stroke-width="3">${[100,120,140,160,180,200].map(x=>`<path d="M${x} 50 L${x} 98"/>`).join("")}</g>
      <rect x="72" y="94" width="156" height="26" rx="12" fill="#f28c28" ${OUT}/>
      <circle cx="150" cy="26" r="17" fill="#fff6e0" ${OUT}/>`},
    {id:"crown", name:"Korona", svg:`
      <path d="M96 96 L94 44 L122 68 L150 30 L178 68 L206 44 L204 96 Z" fill="url(#gold)" ${OUT}/>
      <circle cx="150" cy="78" r="7" fill="#e8434b" stroke="#2b1d22" stroke-width="2"/>
      <circle cx="120" cy="82" r="5" fill="#3fa9f5" stroke="#2b1d22" stroke-width="2"/>
      <circle cx="180" cy="82" r="5" fill="#3fc77a" stroke="#2b1d22" stroke-width="2"/>
      <circle cx="94" cy="42" r="5" fill="url(#gold)" ${OUT}/><circle cx="150" cy="28" r="5" fill="url(#gold)" ${OUT}/><circle cx="206" cy="42" r="5" fill="url(#gold)" ${OUT}/>`},
    {id:"party", name:"Buli sapka", svg:`
      <path d="M108 84 L150 -2 L192 84 Z" fill="url(#dots)" ${OUT}/>
      <path d="M106 84 Q150 96 194 84" stroke="#ff5c8a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="150" cy="-4" r="10" fill="#ff5c8a" ${OUT}/>`},
    {id:"cowboy", name:"Cowboy kalap", svg:`
      <path d="M104 98 Q98 30 132 36 Q150 48 168 36 Q202 30 196 98 Z" fill="#a8703f" ${OUT}/>
      <path d="M104 86 Q150 96 196 86 L197 98 Q150 108 103 98 Z" fill="#5c3a1e"/>
      <path d="M40 98 Q60 120 150 118 Q240 120 260 98 Q262 88 246 96 Q150 112 54 96 Q38 88 40 98 Z" fill="#8f5c30" ${OUT}/>`},
  ]},
  glasses:{label:"Szemüveg", view:"70 90 160 80", items:[
    {id:"none", name:"Semmi"},
    {id:"sun", name:"Pink napszemüveg", svg:`
      <path d="M80 128 L100 126 M220 128 L200 126" stroke="#2b1d22" stroke-width="4"/>
      <circle cx="121" cy="132" r="20" fill="#ff9fc0" fill-opacity=".85" stroke="#2b1d22" stroke-width="4"/>
      <circle cx="179" cy="132" r="20" fill="#ff9fc0" fill-opacity=".85" stroke="#2b1d22" stroke-width="4"/>
      <path d="M141 130 Q150 124 159 130" stroke="#2b1d22" stroke-width="4" fill="none"/>
      <path d="M110 124 l8 -6 M168 124 l8 -6" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>`},
    {id:"heart", name:"Szív szemüveg", svg:`
      <path d="M80 128 L98 126 M220 128 L202 126" stroke="#2b1d22" stroke-width="4"/>
      <path d="M121 152 C92 132 100 108 121 122 C142 108 150 132 121 152 Z" fill="#ff3b6b" stroke="#2b1d22" stroke-width="3.5"/>
      <path d="M179 152 C150 132 158 108 179 122 C200 108 208 132 179 152 Z" fill="#ff3b6b" stroke="#2b1d22" stroke-width="3.5"/>
      <path d="M140 128 Q150 122 160 128" stroke="#2b1d22" stroke-width="4" fill="none"/>`},
    {id:"nerd", name:"Okos szemüveg", svg:`
      <path d="M80 128 L102 128 M220 128 L198 128" stroke="#2b1d22" stroke-width="4"/>
      <rect x="100" y="116" width="42" height="32" rx="10" fill="#bfe3ff" fill-opacity=".25" stroke="#2b1d22" stroke-width="5"/>
      <rect x="158" y="116" width="42" height="32" rx="10" fill="#bfe3ff" fill-opacity=".25" stroke="#2b1d22" stroke-width="5"/>
      <path d="M142 128 Q150 122 158 128" stroke="#2b1d22" stroke-width="5" fill="none"/>`},
  ]},
  top:{label:"Felső", view:"55 190 190 180", items:[
    {id:"tee", name:"Szürke póló", svg: sleeves("#dfe7e5", true) + `
      <path d="${TORSO}" fill="#dfe7e5" ${OUT}/>
      <g stroke="#c7d1cf" stroke-width="2">${[256,272,288,304,320,336].map(y=>`<path d="M96 ${y} L204 ${y}"/>`).join("")}</g>
      <path d="M130 228 Q150 246 170 228" stroke="#2b1d22" stroke-width="3" fill="#cbd6d3"/>`},
    {id:"hoodie", name:"Piros kapucnis", svg: sleeves("#e14b4b", false) + `
      <path d="${TORSO}" fill="#e14b4b" ${OUT}/>
      <path d="M118 300 L182 300 L190 340 L110 340 Z" fill="#c63a3a" ${OUT}/>
      <path d="M116 230 Q150 262 184 230 Q150 244 116 230 Z" fill="#c63a3a" ${OUT}/>
      <path d="M140 244 L138 280 M160 244 L162 280" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M82 324 L82 334 M218 324 L218 334" stroke="#c63a3a" stroke-width="30"/>`},
    {id:"hawaii", name:"Hawaii ing", svg: sleeves("url(#hawaii)", true) + `

/* Rétegsorrend */
const ORDER = ["pants","shoes","top","jacket","extra","glasses","hat"];
const DEFAULT = {hat:"none", glasses:"none", top:"tee", jacket:"puffer", pants:"cargo", shoes:"sneaker", extra:"none"};
let outfit = {...DEFAULT};
let current = "top";

function find(cat,id){ return C[cat].items.find(i=>i.id===id) || C[cat].items[0]; }
function piece(cat){ const it = find(cat,outfit[cat]); return it.svg ? `<g data-cat="${cat}">${it.svg}</g>` : ""; }

function render(changed){
  const L = document.getElementById("layers");
  L.innerHTML =
    bodyBase() + piece("shoes") + piece("pants") +
    torsoBase() + piece("top") + `<path d="${TORSO}" fill="url(#clothShade)"/>` + piece("jacket") + hands() +
    (["chain","scarf"].includes(outfit.extra) ? piece("extra") : "") +
    head() + hair() + piece("hat") + piece("glasses") +
    (["chain","scarf"].includes(outfit.extra) ? "" : piece("extra"));
  if(changed){
    const g = L.querySelector(`[data-cat="${changed}"]`);
    if(g){ g.classList.add("pop"); g.style.transformOrigin="center"; g.style.transformBox="fill-box"; }
  }
}

/* ---------- UI ---------- */
const tabsEl = document.getElementById("tabs"), itemsEl = document.getElementById("items");
const ghost = () => `<g opacity=".18">${bodyBase()}${torsoBase()}${hands()}${head()}${hair()}</g>`;

function buildTabs(){
  tabsEl.innerHTML = "";
  for(const k of Object.keys(C)){
    const b = document.createElement("button");
    b.className = "tab" + (k===current ? " on":"");
    b.textContent = C[k].label;
    b.onclick = () => { current = k; buildTabs(); buildItems(); };
    tabsEl.appendChild(b);
  }
}
function buildItems(){
  itemsEl.innerHTML = "";
  const cat = C[current];
  for(const it of cat.items){
    const b = document.createElement("button");
    b.className = "item" + (outfit[current]===it.id ? " on":"");
    b.innerHTML = (it.svg
      ? `<svg viewBox="${cat.view}">${ghost()}${it.svg}</svg>`
      : `<div class="none">🚫</div>`) + `<span>${it.name}</span>`;
    b.onclick = () => { outfit[current] = it.id; render(current); buildItems(); };
    itemsEl.appendChild(b);
  }
  itemsEl.scrollLeft = 0;
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"),1500);
}

document.getElementById("btnReset").onclick = () => { outfit = {...DEFAULT}; render(); buildItems(); toast("Eredeti szett ✨"); };
document.getElementById("btnRandom").onclick = () => {
  for(const k of Object.keys(C)){ const arr = C[k].items; outfit[k] = arr[Math.floor(Math.random()*arr.length)].id; }
  render(); buildItems(); bounce(); toast("Meglepetés! 🎲");
};
document.getElementById("btnSave").onclick = savePNG;

/* ---------- Easter egg: 5 koppintás = Szeretlek ---------- */
const hero = document.getElementById("hero"), love = document.getElementById("love");
let taps = 0, tapTimer;
function bounce(){ hero.classList.remove("tap"); void hero.getBoundingClientRect(); hero.classList.add("tap"); }
hero.addEventListener("animationend", e => { if(e.animationName==="boing") hero.classList.remove("tap"); });
hero.addEventListener("click", () => {
  bounce();
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=> taps = 0, 1500);
  if(taps >= 5){ taps = 0; showLove(); }
});
function showLove(){
  love.classList.add("show");
  if(navigator.vibrate) navigator.vibrate([80,60,80,60,200]);
  const emojis = ["❤️","💖","💕","💗","💘","😘"];
  for(let i=0;i<36;i++){
    const s = document.createElement("span");
    s.className = "fh";
    s.textContent = emojis[i % emojis.length];
    s.style.left = Math.random()*100 + "vw";
    s.style.fontSize = (18 + Math.random()*34) + "px";
    s.style.animationDuration = (3 + Math.random()*3) + "s";
    s.style.animationDelay = (Math.random()*1.5) + "s";
    love.appendChild(s);
    setTimeout(()=>s.remove(), 7000);
  }
}
love.addEventListener("click", () => love.classList.remove("show"));

/* ---------- Kép mentése ---------- */
function savePNG(){
  const clone = hero.cloneNode(true);
  clone.setAttribute("width", 900); clone.setAttribute("height", 1500);
  clone.querySelector(".bob").removeAttribute("class");
  const xml = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = 900; c.height = 1500;
    const ctx = c.getContext("2d");
    const g = ctx.createLinearGradient(0,0,0,1500); g.addColorStop(0,"#ffe3ec"); g.addColorStop(1,"#e3f0ff");
    ctx.fillStyle = g; ctx.fillRect(0,0,900,1500);
    ctx.drawImage(img,0,0,900,1500);
    c.toBlob(async blob => {
      const file = new File([blob], "szettem.png", {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:"A szettem"}); return; }catch(e){ if(e.name==="AbortError") return; }
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "szettem.png"; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      toast("Kép elmentve 📸");
    }, "image/png");
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

render(); buildTabs(); buildItems();
